---
<!doctype html>
<html lang="{{ site.lang | default: 'ko-KR' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="icon" type="image/png" href="{{ '/assets/brand/favicon-tight.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
  <title>{{ page.title | default: site.title | escape }} | {{ site.title | escape }}</title>
  <script>
    (() => {
      const savedTheme = localStorage.getItem('ai-oneplate-theme');
      const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = savedTheme || systemTheme;
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#content">본문으로 건너뛰기</a>
  {% include header.html %}
  {{ content }}
  {% include site-scripts.html %}
</body>
</html>
