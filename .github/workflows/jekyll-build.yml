name: Jekyll build

# Historical static-site validation; never part of Blogger publication.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jekyll-build:
    name: jekyll-build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build with the project Docker image
        run: docker compose run --rm jekyll bundle exec jekyll build --trace