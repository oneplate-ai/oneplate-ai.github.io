name: Blogger operations

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blogger-operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release gates and Blogger runtime
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Test operating contract
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Reject whitespace errors
        run: git diff --check HEAD^
