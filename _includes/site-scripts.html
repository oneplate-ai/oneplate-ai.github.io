<script>
  const themeToggle = document.querySelector('.theme-toggle');
  const updateThemeButton = () => {
    const isDark = document.documentElement.dataset.theme === 'dark';
    themeToggle.setAttribute('aria-pressed', String(isDark));
    themeToggle.setAttribute('aria-label', isDark ? themeToggle.dataset.themeToLight : themeToggle.dataset.themeToDark);
    themeToggle.querySelector('.theme-label').textContent = isDark ? themeToggle.dataset.themeLightLabel : themeToggle.dataset.themeDarkLabel;
  };
  updateThemeButton();
  themeToggle.addEventListener('click', () => {
    const nextTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = nextTheme;
    localStorage.setItem('ai-oneplate-theme', nextTheme);
    updateThemeButton();
  });

  const languageSwitcher = document.querySelector('.language-switcher');
  const languageToggle = document.querySelector('.language-toggle');
  const languageMenu = document.querySelector('#language-menu');
  const closeLanguageMenu = () => {
    languageMenu.hidden = true;
    languageToggle.setAttribute('aria-expanded', 'false');
  };
  const toggleLanguageMenu = () => {
    const isOpen = !languageMenu.hidden;
    languageMenu.hidden = isOpen;
    languageToggle.setAttribute('aria-expanded', String(!isOpen));
  };
  languageToggle.addEventListener('click', toggleLanguageMenu);
  document.addEventListener('click', (event) => {
    if (!languageSwitcher.contains(event.target)) closeLanguageMenu();
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      closeLanguageMenu();
      languageToggle.focus();
    }
  });

  const backToTop = document.querySelector('.back-to-top');
  const updateBackToTop = () => {
    backToTop.hidden = window.scrollY < 500;
  };
  window.addEventListener('scroll', updateBackToTop, { passive: true });
  updateBackToTop();
  backToTop.addEventListener('click', () => {
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({ top: 0, behavior: prefersReducedMotion ? 'auto' : 'smooth' });
  });

  const siteHeader = document.querySelector('.site-header');
  const menuToggle = document.querySelector('.menu-toggle');
  const primaryNav = document.querySelector('#primary-nav');
  menuToggle.addEventListener('click', () => {
    const isOpen = siteHeader.classList.toggle('nav-open');
    menuToggle.setAttribute('aria-expanded', String(isOpen));
  });
  document.querySelectorAll('.coming-soon-link').forEach((link) => {
    link.addEventListener('click', (event) => {
      event.preventDefault();
      const message = document.querySelector('#coming-soon-message');
      const template = siteHeader.dataset.comingSoonTemplate;
      message.textContent = template.replace('{series}', link.dataset.seriesName);
      const bounds = link.getBoundingClientRect();
      const isMobile = window.matchMedia('(max-width: 720px)').matches;
      message.style.left = `${isMobile ? window.innerWidth / 2 : bounds.left + bounds.width / 2}px`;
      message.style.top = `${isMobile ? Math.min(bounds.bottom + 10, window.innerHeight - 80) : bounds.bottom + 10}px`;
      message.hidden = false;
      clearTimeout(window.comingSoonTimer);
      window.comingSoonTimer = setTimeout(() => { message.hidden = true; }, 1500);
      siteHeader.classList.remove('nav-open');
      menuToggle.setAttribute('aria-expanded', 'false');
    });
  });
</script>
